# Publica o servidor de notificações (worker/) no Cloudflare.
# Precisa de 2 segredos do repositório (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  e  CLOUDFLARE_ACCOUNT_ID
name: Publicar notificações (Cloudflare)

on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/deploy-push.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Conferir segredos
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Faltam os segredos CLOUDFLARE_API_TOKEN e/ou CLOUDFLARE_ACCOUNT_ID"; exit 1
          fi

      - name: Instalar wrangler
        run: npm install --no-save wrangler@3

      - name: Criar/usar armazenamento KV
        run: |
          set -e
          ID=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces?per_page=100" \
            | jq -r '.result[] | select(.title=="sir-push-kv") | .id' | head -n1)
          if [ -z "$ID" ]; then
            ID=$(curl -fsS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
              --data '{"title":"sir-push-kv"}' \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces" | jq -r '.result.id')
          fi
          echo "KV: $ID"
          sed -i "s/__KV_ID__/$ID/" wrangler.toml

      - name: Publicar
        run: npx wrangler deploy 2>&1 | tee deploy.log

      - name: Endereço do servidor
        run: |
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -n1)
          echo "SIR_PUSH_URL=$URL"
          echo "### Servidor de notificações: $URL" >> $GITHUB_STEP_SUMMARY
