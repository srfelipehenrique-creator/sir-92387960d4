# Mostra a chave PÚBLICA do servidor (a mesma usada para trancar a base de nodes),
# para criptografar a carga inicial do OTS. A chave pública pode ser vista por qualquer um.
name: OTS - chave pública do servidor
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ots-pubkey.yml']
  workflow_dispatch:
jobs:
  pubkey:
    runs-on: ubuntu-latest
    steps:
      - name: Ler chave pública
        run: |
          K=$(curl -fsS https://sir-push.srfelipehenrique.workers.dev/nodes/pubkey | jq -r .publicKey)
          echo "::notice title=pubkey::$K"
