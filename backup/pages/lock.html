<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SIR">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#141416">
<link rel="manifest" href="../assets/manifest.json">
<link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
<title>SIR · Acesso</title>
<script src="../js/theme-mode.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700;800&display=swap');

  :root {
    --accent: #6366f1;
    --accent-glow: rgba(99,102,241,0.3);
    --bg: #141416;
    --panel: #1c1c1f;
    --elevated: #28282c;
    --line: rgba(255,255,255,0.08);
    --line-strong: rgba(255,255,255,0.14);
    --text: #e2e2e2;
    --text-soft: rgba(226,226,226,0.72);
    --text-muted: rgba(226,226,226,0.42);
    --text-dim: rgba(226,226,226,0.2);
    --red: #ef4444;
    --ease-out: cubic-bezier(0.16,1,0.3,1);
    --ease-spring: cubic-bezier(0.34,1.56,0.64,1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 80% 60% at 50% -10%, rgba(99,102,241,0.12) 0%, transparent 60%),
      radial-gradient(ellipse 50% 40% at 80% 110%, rgba(99,102,241,0.06) 0%, transparent 60%);
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--text);
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Partículas de fundo ── */
  .bg-grid {
    position: fixed; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(99,102,241,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(99,102,241,0.04) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, black 40%, transparent 100%);
    animation: gridPulse 8s ease-in-out infinite;
  }
  @keyframes gridPulse { 0%,100%{opacity:.4} 50%{opacity:.7} }

  /* ── Card central ── */
  .lock-card {
    position: relative; z-index: 10;
    background: var(--panel);
    border: 1px solid var(--line-strong);
    border-radius: 20px;
    padding: 48px 44px 40px;
    width: 100%; max-width: 420px;
    box-shadow: 0 32px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.04);
    animation: cardIn 0.7s var(--ease-out) both;
  }
  @keyframes cardIn {
    from { opacity:0; transform: translateY(28px) scale(0.96); }
  }

  /* ── Brand ── */
  .lock-logo {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    margin-bottom: 40px;
  }
  .lock-logo-icon {
    width: 52px; height: 52px;
    background: linear-gradient(135deg, var(--accent), rgba(99,102,241,0.6));
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 28px var(--accent-glow);
  }
  .lock-logo-icon svg { width: 28px; height: 28px; fill: none; }
  .lock-brand {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; font-weight: 700; letter-spacing: 4px;
    text-transform: uppercase;
    background: linear-gradient(135deg, #e2e2e2 0%, rgba(226,226,226,0.5) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .lock-subtitle {
    font-size: 11px; color: var(--text-muted); letter-spacing: 1.5px;
    text-transform: uppercase; font-weight: 500;
  }

  /* ── Formulário ── */
  .lock-label {
    display: block; font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 1.5px; color: var(--text-muted); margin-bottom: 8px;
  }

  .lock-input-wrap {
    position: relative; margin-bottom: 6px;
    border-radius: 10px; overflow: hidden;
    border: 1.5px solid var(--line-strong);
    background: var(--elevated);
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .lock-input-wrap:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
  }
  .lock-input-wrap.error {
    border-color: var(--red);
    box-shadow: 0 0 0 3px rgba(239,68,68,0.12);
    animation: shake 0.4s ease;
  }
  @keyframes shake {
    0%,100%{ transform:translateX(0); }
    20%    { transform:translateX(-6px); }
    40%    { transform:translateX(6px); }
    60%    { transform:translateX(-4px); }
    80%    { transform:translateX(4px); }
  }

  .lock-key-icon {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    color: var(--text-muted); pointer-events: none;
    display: flex; align-items: center;
  }
  .lock-key-icon svg { width: 16px; height: 16px; }

  .lock-input {
    width: 100%; background: transparent; border: none; outline: none;
    color: var(--text); font-family: 'JetBrains Mono', monospace;
    font-size: 15px; font-weight: 700; letter-spacing: 3px;
    padding: 14px 44px 14px 42px; height: 52px;
  }
  .lock-input::placeholder { color: var(--text-dim); letter-spacing: 2px; font-weight: 400; font-size: 13px; }

  .lock-toggle {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer;
    color: var(--text-muted); padding: 4px;
    display: flex; align-items: center;
    transition: color 0.15s;
  }
  .lock-toggle:hover { color: var(--text-soft); }
  .lock-toggle svg { width: 16px; height: 16px; }

  .lock-error {
    font-size: 11px; color: var(--red); margin-bottom: 14px; height: 16px;
    display: flex; align-items: center; gap: 5px;
    opacity: 0; transition: opacity 0.2s;
  }
  .lock-error.show { opacity: 1; }

  /* ── Botão ── */
  .lock-btn {
    width: 100%; height: 52px;
    background: var(--accent); color: #fff; border: none;
    border-radius: 10px; font-family: 'Inter', sans-serif;
    font-size: 13px; font-weight: 700; letter-spacing: 1px;
    text-transform: uppercase; cursor: pointer;
    position: relative; overflow: hidden;
    box-shadow: 0 6px 24px var(--accent-glow);
    transition: filter 0.2s, transform 0.2s, box-shadow 0.2s;
  }
  .lock-btn:hover:not(:disabled) { filter: brightness(1.1); transform: translateY(-1px); box-shadow: 0 10px 32px var(--accent-glow); }
  .lock-btn:active:not(:disabled) { transform: translateY(0) scale(0.98); }
  .lock-btn:disabled { opacity: 0.6; cursor: not-allowed; }

  .lock-btn .btn-text { transition: opacity 0.2s; }
  .lock-btn .btn-loader { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s; }
  .lock-btn.loading .btn-text { opacity: 0; }
  .lock-btn.loading .btn-loader { opacity: 1; }

  .loader-ring {
    width: 22px; height: 22px; border-radius: 50%;
    border: 2.5px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Sucesso ── */
  .lock-success {
    position: absolute; inset: 0; border-radius: 20px;
    background: var(--panel);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; opacity: 0; pointer-events: none;
    transition: opacity 0.4s;
  }
  .lock-success.show { opacity: 1; pointer-events: auto; }
  .success-icon {
    width: 56px; height: 56px; border-radius: 50%;
    background: rgba(34,197,94,0.12); border: 2px solid rgba(34,197,94,0.4);
    display: flex; align-items: center; justify-content: center;
    animation: successPop 0.5s var(--ease-spring);
  }
  @keyframes successPop { from { transform: scale(0.5); opacity:0; } }
  .success-icon svg { width: 26px; height: 26px; color: #22c55e; }
  .success-text { font-size: 14px; font-weight: 600; color: var(--text-soft); }
  .success-sub  { font-size: 11px; color: var(--text-muted); }

  /* ── Footer ── */
  .lock-footer {
    margin-top: 28px; text-align: center;
    font-size: 10px; color: var(--text-dim); letter-spacing: 0.8px;
  }

  /* ── PWA banner ── */
  .pwa-banner {
    margin-top: 16px; padding: 11px 14px;
    background: rgba(99,102,241,0.08); border: 1px solid rgba(99,102,241,0.2);
    border-radius: 10px; display: none; align-items: center; gap: 10px;
    animation: fadeIn 0.4s ease;
  }
  .pwa-banner.show { display: flex; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } }
  .pwa-banner-text { flex: 1; font-size: 11px; color: var(--text-soft); line-height: 1.5; }
  .pwa-banner-text strong { color: var(--text); display: block; font-size: 12px; margin-bottom: 2px; }
  .btn-pwa-install {
    padding: 7px 13px; background: var(--accent); color: #fff; border: none;
    border-radius: 7px; font-size: 11px; font-weight: 700; cursor: pointer;
    white-space: nowrap; flex-shrink: 0;
    transition: filter 0.15s;
  }
  .btn-pwa-install:hover { filter: brightness(1.1); }

  /* Celular: margem lateral, áreas seguras e sem zoom no iOS ao digitar */
  body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  @media (max-width: 480px) {
    .lock-card { width: calc(100% - 32px); padding: 36px 24px 30px; }
  }
  @media (pointer: coarse) { .lock-input { font-size: 16px; } }

  /* Modo claro (segue a escolha feita no painel ou o tema do aparelho) */
  :root[data-mode="light"] {
    --bg: #f3f4f6; --panel: #ffffff; --elevated: #f5f6f8;
    --line: rgba(15,23,42,0.10); --line-strong: rgba(15,23,42,0.18);
    --text: #17191d; --text-soft: rgba(23,25,29,0.76); --text-muted: rgba(23,25,29,0.54); --text-dim: rgba(23,25,29,0.34);
  }
  :root[data-mode="light"] .lock-brand { background: linear-gradient(135deg, #17191d 0%, rgba(23,25,29,0.55) 100%); -webkit-background-clip: text; background-clip: text; }
  :root[data-mode="light"] .lock-card { box-shadow: 0 24px 60px rgba(15,23,42,0.14), 0 0 0 1px rgba(15,23,42,0.05); }

  /* ── Entrada (v90): fibras de luz convergem num núcleo, pulso em anéis, cartão surge ── */
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
  body.intro-on .lock-card { animation: none; opacity: 0; transform: scale(0.9); }
  body.intro-on .bg-grid { opacity: 0; }
  .lock-card.surge { animation: cardSurge 0.9s var(--ease-out) both; }
  @keyframes cardSurge {
    0%   { opacity: 0; transform: scale(0.86); filter: blur(6px); }
    60%  { opacity: 1; filter: blur(0); }
    100% { opacity: 1; transform: none; }
  }
  .fx-skip {
    position: fixed; right: 20px; bottom: calc(20px + env(safe-area-inset-bottom)); z-index: 30;
    font: 600 12px 'Inter', system-ui, sans-serif; letter-spacing: .4px;
    color: var(--text-soft); background: var(--panel); border: 1px solid var(--line-strong);
    border-radius: 999px; padding: 9px 16px; cursor: pointer; backdrop-filter: blur(6px);
    transition: opacity .3s;
  }
  .fx-skip:hover, .fx-skip:focus-visible { color: var(--text); border-color: var(--accent); outline: none; }
  body:not(.intro-on) .fx-skip { opacity: 0; pointer-events: none; }
</style>

<body>

<canvas id="fx" aria-hidden="true"></canvas>
<button class="fx-skip" id="fx-skip" type="button">Pular</button>
<div class="bg-grid"></div>

<div class="lock-card" id="lock-card">

  <!-- Sucesso -->
  <div class="lock-success" id="lock-success">
    <div class="success-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>
    <div class="success-text">Acesso liberado</div>
    <div class="success-sub">Carregando o dashboard...</div>
  </div>

  <!-- Brand -->
  <div class="lock-logo">
    <div class="lock-logo-icon">
      <svg viewBox="0 0 512 512">
        <rect x="60" y="290" width="80" height="162" rx="8" fill="rgba(255,255,255,0.9)"/>
        <rect x="176" y="200" width="80" height="252" rx="8" fill="rgba(255,255,255,0.75)"/>
        <rect x="292" y="130" width="80" height="322" rx="8" fill="rgba(255,255,255,0.6)"/>
        <rect x="408" y="60"  width="44" height="392" rx="8" fill="rgba(255,255,255,0.4)"/>
        <path d="M60 290 L216 200 L332 130 L452 60" stroke="white" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
    </div>
    <span class="lock-brand">SIR · Dashboard</span>
    <span class="lock-subtitle">COP REDE FIBRA RJ/ES</span>
  </div>

  <!-- Form -->
  <label class="lock-label" for="lock-key">Chave de acesso</label>

  <div class="lock-input-wrap" id="input-wrap">
    <span class="lock-key-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="7.5" cy="15.5" r="5.5"/>
        <path d="M21 2l-9.6 9.6M15.5 7.5l2 2"/>
      </svg>
    </span>
    <input type="password" id="lock-key" class="lock-input" placeholder="Digite a chave..." autocomplete="off" autofocus maxlength="32">
    <button class="lock-toggle" id="toggle-vis" onclick="toggleVisibility()" type="button" title="Mostrar/ocultar">
      <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>

  </div>

  <div class="lock-error" id="lock-error">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
      <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><circle cx="12" cy="16" r=".5" fill="currentColor"/>
    </svg>
    Chave incorreta. Tente novamente.
  </div>

  <button class="lock-btn" id="lock-btn" onclick="tryAccess()">
    <span class="btn-text">Acessar</span>
    <span class="btn-loader"><div class="loader-ring"></div></span>
  </button>

  <!-- Banner PWA (aparece após autenticação bem sucedida se disponível) -->
  <div class="pwa-banner" id="pwa-banner">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2" stroke-linecap="round">
      <path d="M12 2a10 10 0 1 0 10 10"/><path d="M12 8v4l3 3"/><path d="M18 2v4h4"/>
    </svg>
    <div class="pwa-banner-text">
      <strong>Instalar como app</strong>
      Acesse o SIR Dashboard diretamente pelo atalho, sem abrir o navegador.
    </div>
    <button class="btn-pwa-install" onclick="installPWA()">Instalar</button>
  </div>

  <div class="lock-footer">
    Uso exclusivo interno — COP REDE
  </div>

</div>

<script>
  /* Verificação por hash SHA-256 — a chave nunca aparece em texto no código */
  const _h = [
    '329acaf5', 'd0f68075', 'ccc1e62c', 'ea32157d',
    'b54a9ffe', '29e1c1d5', '90c81ac9', '158a1a13'
  ].join('');

  const _s  = 'sir_auth_v1';
  const _r  = '../index.html';

  let deferredInstall = null;
  let eyeOpen = false;

  if (localStorage.getItem(_s) === 'granted') location.replace(_r);

  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; });

  async function _digest(str) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  }

  function toggleVisibility() {
    const inp = document.getElementById('lock-key');
    const ico = document.getElementById('eye-icon');
    eyeOpen = !eyeOpen;
    inp.type = eyeOpen ? 'text' : 'password';
    ico.innerHTML = eyeOpen
      ? `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>`
      : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
  }

  document.getElementById('lock-key').addEventListener('keydown', e => {
    if (e.key === 'Enter') tryAccess();
    if (e.key !== 'Enter') clearError();
  });

  function clearError() {
    document.getElementById('lock-error').classList.remove('show');
    document.getElementById('input-wrap').classList.remove('error');
  }

  async function tryAccess() {
    const btn = document.getElementById('lock-btn');
    const raw = document.getElementById('lock-key').value.trim();

    if (!raw) return;

    btn.disabled = true;
    btn.classList.add('loading');
    clearError();

    /* Hash do que o usuário digitou — comparado com o hash armazenado */
    const [inputHash] = await Promise.all([
      _digest(raw),
      new Promise(r => setTimeout(r, 480))
    ]);

    if (inputHash !== _h) {
      btn.disabled = false;
      btn.classList.remove('loading');
      document.getElementById('lock-error').classList.add('show');
      document.getElementById('input-wrap').classList.add('error');
      document.getElementById('lock-key').value = '';
      document.getElementById('lock-key').focus();
      return;
    }

    /* ── Autenticado ── */
    localStorage.setItem(_s, 'granted');
    /* Guarda a chave neste aparelho para ativar as notificações push (uso pessoal) */
    try { localStorage.setItem('sir_push_key', raw); } catch (e) {}

    /* Mostra overlay de sucesso */
    document.getElementById('lock-success').classList.add('show');

    /* Tenta iniciar instalação PWA antes de redirecionar */
    if (deferredInstall) {
      try {
        document.getElementById('pwa-banner').classList.add('show');
        /* Aguarda o usuário interagir (ou timeout de 3s) e redireciona */
        await new Promise(r => setTimeout(r, 3000));
      } catch(e) {}
    }

    location.replace(_r);
  }

  async function installPWA() {
    if (!deferredInstall) return;
    const btn = document.querySelector('.btn-pwa-install');
    btn.textContent = 'Instalando...'; btn.disabled = true;
    const { outcome } = await deferredInstall.prompt().then(() => deferredInstall.userChoice);
    deferredInstall = null;
    if (outcome === 'accepted') {
      btn.textContent = '✓ Instalado!';
    } else {
      location.replace(_r);
    }
  }
</script>
<script>
/* ── Entrada animada (v90) ──
   Toca uma vez por sessão; quem prefere menos movimento vê o cartão direto.
   Clique, toque, tecla ou "Pular" encerram na hora. Depois fica um fundo leve. */
(function () {
  const cv = document.getElementById('fx'), cx = cv.getContext('2d');
  const card = document.getElementById('lock-card');
  const skipBtn = document.getElementById('fx-skip');
  const calmo = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  let jaViu = false; try { jaViu = sessionStorage.getItem('sir_intro_v1') === '1'; } catch (e) {}
  const claro = () => document.documentElement.getAttribute('data-mode') === 'light';
  const DUR = 2300;              /* duração da entrada (ms) */
  let W = 0, H = 0, R = 0, dpr = 1, t0 = 0, fim = false, fibras = [], raf = 0;

  function medir() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight; R = Math.hypot(W, H) / 2;
    cv.width = W * dpr; cv.height = H * dpr; cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    criarFibras();
  }
  function criarFibras() {
    const n = W < 600 ? 14 : 22;
    fibras = [];
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + Math.random() * 0.35;
      const curva = (Math.random() - 0.5) * 0.9;           /* fibras levemente curvas, como cabos */
      fibras.push({ a, curva, atraso: Math.random() * 0.35, vel: 0.75 + Math.random() * 0.5, cor: Math.random() < 0.7 ? 0 : 1 });
    }
  }
  /* ponto da fibra: s=0 na borda, s=1 no núcleo */
  function ponto(f, s) {
    const r = R * (1 - s) + 34 * s;
    const ang = f.a + f.curva * (1 - s) * (1 - s);
    return [W / 2 + Math.cos(ang) * r, H / 2 + Math.sin(ang) * r];
  }
  const COR = () => claro() ? ['79,70,229', '14,116,144'] : ['129,140,248', '56,189,248'];

  function aneis(alfa, escala) {
    const c = claro() ? '15,23,42' : '255,255,255';
    for (let i = 1; i <= 7; i++) {
      const r = (60 + i * i * 14) * escala;
      cx.beginPath(); cx.arc(W / 2, H / 2, r, 0, Math.PI * 2);
      cx.strokeStyle = `rgba(${c},${alfa * (0.09 - i * 0.008)})`; cx.lineWidth = 1.5; cx.stroke();
    }
  }
  function fibra(f, cabeca, comp, alfa) {
    const ini = Math.max(0, cabeca - comp);
    if (cabeca <= 0) return;
    const [r1, r2] = [ponto(f, ini), ponto(f, Math.min(1, cabeca))];
    const g = cx.createLinearGradient(r1[0], r1[1], r2[0], r2[1]);
    const c = COR()[f.cor];
    g.addColorStop(0, `rgba(${c},0)`); g.addColorStop(1, `rgba(${c},${alfa})`);
    cx.beginPath();
    for (let k = 0; k <= 12; k++) { const p = ponto(f, ini + (Math.min(1, cabeca) - ini) * k / 12); k ? cx.lineTo(p[0], p[1]) : cx.moveTo(p[0], p[1]); }
    cx.strokeStyle = g; cx.lineWidth = 2; cx.lineCap = 'round';
    cx.shadowColor = `rgba(${c},${alfa})`; cx.shadowBlur = 12; cx.stroke(); cx.shadowBlur = 0;
  }

  function quadroEntrada(now) {
    const t = (now - t0) / DUR;
    cx.clearRect(0, 0, W, H);
    aneis(Math.min(1, t * 3), 1 + 0.06 * (1 - Math.min(1, t)));
    /* 0–65%: pulsos correm pelas fibras até o núcleo */
    fibras.forEach(f => { const c = (t / 0.65 - f.atraso) * f.vel * 1.4; if (c > 0 && c < 1.35) fibra(f, c, 0.35, 0.95); });
    /* núcleo acende conforme a luz chega */
    const carga = Math.max(0, Math.min(1, (t - 0.35) / 0.3));
    if (carga > 0) {
      const c = COR()[0], g = cx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, 70 + 40 * carga);
      g.addColorStop(0, `rgba(${c},${0.55 * carga})`); g.addColorStop(1, `rgba(${c},0)`);
      cx.fillStyle = g; cx.beginPath(); cx.arc(W / 2, H / 2, 110, 0, Math.PI * 2); cx.fill();
    }
    /* 65%+: onda de choque em anéis e o cartão surge */
    if (t > 0.65) {
      const u = (t - 0.65) / 0.35, c = COR()[1];
      for (let k = 0; k < 3; k++) {
        const v = u - k * 0.12; if (v <= 0) continue;
        cx.beginPath(); cx.arc(W / 2, H / 2, 40 + v * R, 0, Math.PI * 2);
        cx.strokeStyle = `rgba(${c},${0.5 * (1 - v)})`; cx.lineWidth = 2.5 - k * 0.6; cx.stroke();
      }
      if (!card.classList.contains('surge')) revelar();
    }
    if (t >= 1) { encerrar(); return; }
    raf = requestAnimationFrame(quadroEntrada);
  }

  /* fundo leve depois da entrada: um pulso de vez em quando */
  let pulsos = [], proximo = 0, ultimo = 0;
  function quadroCalmo(now) {
    if (document.hidden) { raf = requestAnimationFrame(quadroCalmo); return; }
    if (now - ultimo < 33) { raf = requestAnimationFrame(quadroCalmo); return; }  /* ~30 qps basta */
    const dt = ultimo ? (now - ultimo) / 1000 : 0; ultimo = now;
    cx.clearRect(0, 0, W, H);
    aneis(0.7, 1);
    if (now > proximo && fibras.length) { pulsos.push({ f: fibras[(Math.random() * fibras.length) | 0], s: 0 }); proximo = now + 900 + Math.random() * 1400; }
    pulsos = pulsos.filter(p => (p.s += dt * 0.45) < 1.3);
    pulsos.forEach(p => fibra(p.f, p.s, 0.25, 0.4));
    raf = requestAnimationFrame(quadroCalmo);
  }

  function revelar() {
    document.body.classList.remove('intro-on');
    card.classList.add('surge');
    const k = document.getElementById('lock-key'); if (k) setTimeout(() => k.focus(), 350);
  }
  function encerrar() {
    if (fim) return; fim = true;
    cancelAnimationFrame(raf);
    try { sessionStorage.setItem('sir_intro_v1', '1'); } catch (e) {}
    if (!card.classList.contains('surge')) revelar();
    if (skipBtn.isConnected) skipBtn.remove();
    ['pointerdown', 'keydown'].forEach(ev => removeEventListener(ev, pular, true));
    raf = requestAnimationFrame(quadroCalmo);
  }
  function pular(e) { if (e && e.type === 'keydown' && e.key === 'Tab') return; encerrar(); }

  medir();
  addEventListener('resize', medir);
  if (calmo) { cv.style.display = 'none'; skipBtn.remove(); return; }   /* sem animação: cartão aparece normal */
  if (jaViu) { skipBtn.remove(); fim = true; raf = requestAnimationFrame(quadroCalmo); return; }
  document.body.classList.add('intro-on');
  skipBtn.addEventListener('click', encerrar);
  ['pointerdown', 'keydown'].forEach(ev => addEventListener(ev, pular, true));
  t0 = performance.now();
  setTimeout(encerrar, DUR + 1500);   /* rede de segurança: aba em 2º plano não deixa o cartão escondido */
  raf = requestAnimationFrame(quadroEntrada);
})();
</script>
<script src="../js/pressable.js"></script>
</body>
</html>
